
name: Sync ESPN Fantasy League and Publish

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
    - cron: "2,17,32,47 16-23 * * 0,1,4"
    - cron: "2,17,32,47 0-5 * * 1,2,5"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q scripts

      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text()
          js=html.rsplit("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/dashboard.js").write_text(js)
          PY
          node --check /tmp/dashboard.js

      - name: Fetch ESPN data and calculate statistics
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python scripts/sync.py

      - name: Validate published league data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/league.json").read_text())
          assert len(d["teams"]) == 10
          assert d["completedWeeks"] >= 1
          for row in d.get("advanced",{}).get("positionPoints",[]):
              assert row["weeks"] == 0 or len(row["slots"]) >= 5, "Invalid starting position mapping"
          print("Validated 10 teams and position mapping")
          PY

      - name: Save updated league statistics
        run: |
          if [[ -n "$(git status --porcelain data/league.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/league.json
            git commit -m "Update ESPN fantasy statistics"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" == 5 ]]; then
                echo "Unable to push ESPN data after five safe retries"
                exit 1
              fi
              sleep 3
            done
          fi

      - name: Prepare static website
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp data/league.json site/data/league.json

      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
