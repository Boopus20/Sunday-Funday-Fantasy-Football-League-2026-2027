
name: Sync ESPN Fantasy League and Publish

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q scripts

      - name: Fetch ESPN data and calculate statistics
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python scripts/sync.py

      - name: Validate published league data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/league.json").read_text())
          assert len(d["teams"]) == 10
          assert d["completedWeeks"] >= 1
          for row in d.get("advanced",{}).get("positionPoints",[]):
              assert row["weeks"] == 0 or len(row["slots"]) >= 5, "Invalid starting position mapping"
          print("Validated 10 teams and position mapping")
          PY

      - name: Save updated league statistics
        run: |
          if [[ -n "$(git status --porcelain data/league.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/league.json
            git commit -m "Update ESPN fantasy statistics"
            git push
          fi

      - name: Prepare static website
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp data/league.json site/data/league.json

      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
