
name: Sync ESPN Fantasy League and Publish

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ESPN data and calculate statistics
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python scripts/sync.py

      - name: Save updated league statistics
        run: |
          if [[ -n "$(git status --porcelain data/league.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/league.json
            git commit -m "Update ESPN fantasy statistics"
            git push

      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish dashboard to GitHub Pages
        uses: actions/deploy-pages@v4
          fi
